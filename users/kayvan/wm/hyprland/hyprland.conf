# similar approach to nwg-displays but listening to hyprland events via hyprland-monitor-attached
# source = ~/.config/hypr/monitors.conf

input {
    kb_layout=us,es,pl
    follow_mouse=0
    touchpad {
        natural_scroll=false
        disable_while_typing=true
    }
    sensitivity=0.5
}

general {
    gaps_in=6
    gaps_out=12
    border_size=4
    col.active_border=0xffb072d1
    col.inactive_border=0xff292a37

    resize_on_border=false

##### TODO un-comment below for verbose logging ###########
    # only for debugging: -2 = full
    #damage_tracking=-2
}

misc {
    # need autoreload to dynamically update monitors conf
    disable_autoreload=false
    force_default_wallpaper=0
  
    # the only sane way to get initial workspace commands working as expected
    initial_workspace_tracking=0
}

binds {
    allow_workspace_cycles = true
}

decoration {
    rounding=4
    blur {
      enabled=true
    }
    fullscreen_opacity=1.0
    active_opacity=1.0
    inactive_opacity=0.8
}

animations {
    enabled=1
    animation=windows,1,4,default,slide
    animation=border,1,5,default
    animation=fade,0
    animation=workspaces,1,9,default
}

dwindle {
    pseudotile=0 # enable pseudotiling on dwindle
}

master {
    orientation=center
    smart_resizing=true
}

# window rules
windowrule=float,class:^(org.gnome.Loupe)$
windowrule=float,class:^(org.pwmt.zathura)$
windowrule=float,class:^(brave)$,title:.*Save(file|As).*
windowrule=float,class:^(brave)$,title:.*DeepL Translate.*
windowrule=float,class:^(audacious)$
windowrule=float,class:^(nemo)$
windowrule=float,class:^(gpclient)$
windowrule=float,class:^(Bazecor)$
windowrule=stayfocused,class:^(pinentry)$
windowrule=stayfocused,class:^(gcr-prompter)$ # gpg pwd prompt

# GIMP window rules
windowrule=group,class:^(Gimp-2.10)
windowrule=float,class:^(Gimp-2.10)$,title:.*Save Image.*
windowrule=center 1,class:^(Gimp-2.10)$,title:.*Exposure.*
windowrule=center 1,class:^(Gimp-2.10)$,title:.*Sharpen.*
windowrule=stayfocused,class:^(Gimp-2.10)$,title:.*Export Image as PNG.*
windowrule=stayfocused,class:^(Gimp-2.10)$,title:.*Save Image.*

# see: https://wiki.hyprland.org/Useful-Utilities/Screen-Sharing/#xwayland
windowrule=opacity 0.0 override,class:^(xwaylandvideobridge)$
windowrule=noanim,class:^(xwaylandvideobridge)$
windowrule=noinitialfocus,class:^(xwaylandvideobridge)$
windowrule=maxsize 1 1,class:^(xwaylandvideobridge)$
windowrule=noblur,class:^(xwaylandvideobridge)$


# submaps
bind=ALT,R,submap,resize
submap=resize

binde=,l,resizeactive,10 0
binde=,h,resizeactive,-10 0
binde=,k,resizeactive,0 -10
binde=,h,resizeactive,0 10

bind=,escape,submap,reset
submap=reset

# binds
bind=SUPER,Return,exec,kitty
bind=SUPER,Backspace,killactive,
bind=SUPERCTRL,Backspace,exit,
bind=SUPER,V,togglefloating,
bind=SUPERSHIFT,F,fullscreen,0

# code:60 is dot (.), code:59 is comma (,)
bind=SUPER,code:60,workspace,r+1
bind=SUPER,code:59,workspace,r-1

bind = ALT,TAB,cyclenext
bind = ALT_SHIFT,TAB,cyclenext,prev

bind=SUPERSHIFT,h,movewindow,l
bind=SUPERSHIFT,l,movewindow,r
bind=SUPERSHIFT,k,movewindow,u
bind=SUPERSHIFT,j,movewindow,d

# workspaces
bind=SUPER,1,focusworkspaceoncurrentmonitor,1
bind=SUPER,2,focusworkspaceoncurrentmonitor,2
bind=SUPER,3,focusworkspaceoncurrentmonitor,3
bind=SUPER,4,focusworkspaceoncurrentmonitor,4
bind=SUPER,5,focusworkspaceoncurrentmonitor,5
bind=SUPER,6,focusworkspaceoncurrentmonitor,6
bind=SUPER,7,focusworkspaceoncurrentmonitor,7
bind=SUPER,8,focusworkspaceoncurrentmonitor,8
bind=SUPER,9,focusworkspaceoncurrentmonitor,9
bind=SUPER,F10,focusworkspaceoncurrentmonitor,10
bind=SUPER,F11,focusworkspaceoncurrentmonitor,11
bind=SUPER,F12,focusworkspaceoncurrentmonitor,12

bind=SUPERSHIFT,1,movetoworkspacesilent,1
bind=SUPERSHIFT,2,movetoworkspacesilent,2
bind=SUPERSHIFT,3,movetoworkspacesilent,3
bind=SUPERSHIFT,4,movetoworkspacesilent,4
bind=SUPERSHIFT,5,movetoworkspacesilent,5
bind=SUPERSHIFT,6,movetoworkspacesilent,6
bind=SUPERSHIFT,7,movetoworkspacesilent,7
bind=SUPERSHIFT,8,movetoworkspacesilent,8
bind=SUPERSHIFT,9,movetoworkspacesilent,9
bind=SUPERSHIFT,F10,movetoworkspacesilent,10
bind=SUPERSHIFT,F11,movetoworkspacesilent,11
bind=SUPERSHIFT,F12,movetoworkspacesilent,12

# special keys
bind=,XF86MonBrightnessUp,exec,brightnessctl set +5%
bind=,XF86MonBrightnessDown,exec,brightnessctl set 5%-
bind=,XF86AudioRaiseVolume,exec,pulsemixer --change-volume +5
bind=,XF86AudioLowerVolume,exec,pulsemixer --change-volume -5
bind=,xF86AudioPlay,exec,playerctl --player=spotify "play-pause"
bind=,xF86AudioStop,exec,playerctl --player=spotify "stop"
bind=,xF86AudioPrev,exec,playerctl --player=spotify "previous"
bind=,xF86AudioNext,exec,playerctl --player=spotify "next"

# resize/move windows with mouse
bindm=SUPER,mouse:272,movewindow
bindm=SUPER,mouse:273,resizewindow
bindm = SUPPERALT, l, resizewindow
